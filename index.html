<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shikho in RYZE Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: one step at a time. A short caption (who, what) beside a large phone. Nothing else on the page.
   RYZE's own screens use the RYZE look. Shikho's pages follow the Shikho partner-page design. */
:root{
  color-scheme: light;
  --ground:#F9F8F5; --paper:#FFFFFF; --sunken:#F1EFEA;
  --ink:#1A1D26; --ink-2:#4B5060; --ink-3:#7C8090; --line:#E3E0D8;
  --navy:#354894; --navy-soft:#E8EBF6;
  --sk-bg:#F4F4F4; --sk-text:#1B1B1F; --sk-mute:#6F7078; --sk-pink:#E5127D; --sk-blue:#5468FF; --sk-card:#EEF4FF; --sk-card-line:#A9C1FF;
  --rz:#9413F1; --rz-deep:#560B8B; --rz-night:#130120; --rz-soft:#F1E4FD;
  --rz-black:#000000; --rz-white:#FFFFFF; --rz-ink:#111114; --rz-mute:#6E6E78; --rz-field:#F1F1F5; --rz-card:#1B1B1F;
  --font:"Figtree","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bn:"Hind Siliguri","Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--rz);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:32px;padding-block:36px 64px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:72px;align-items:center}
.side{min-width:0;display:flex;flex-direction:column;gap:34px}
.eyebrow{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0}
h1{font-size:40px;line-height:1.2;margin:10px 0 0;font-weight:700;text-wrap:balance}
.cap{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:36px;display:flex;flex-direction:column;gap:20px}
.cap .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:17px;color:var(--ink-3);font-weight:600}
.who{font-size:16px;font-weight:700;padding:6px 16px;border-radius:99px}
.who.c{background:var(--sunken);color:var(--ink-2)}
.who.r{background:var(--rz-soft);color:var(--rz-deep)}
.who.s{background:var(--navy-soft);color:var(--navy)}
.cap h2{font-size:30px;line-height:1.3;margin:0;font-weight:700}
.cap p{margin:0;color:var(--ink-2);font-size:20px;line-height:1.65}
.ctrl{display:flex;gap:14px;margin-top:14px}
.ctrl button{border-radius:12px;padding:15px 34px;font-weight:700;font-size:18px;border:1px solid var(--line);background:var(--paper)}
.ctrl .next{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctrl button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:10px}
.dots button{flex:1;height:10px;border-radius:99px;border:0;background:var(--line);padding:0}
.dots button.on{background:var(--rz)}
.note{font-size:16px;line-height:1.6;color:var(--ink-3);margin:0}
.flows{display:flex;flex-wrap:wrap;gap:12px}
.flows button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:11px 22px;font-size:17px;font-weight:600;color:var(--ink-2)}
.flows button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* phone */
.phone{width:390px;max-width:100%;background:#1A1D26;border-radius:52px;padding:13px}
.screen{border-radius:30px;height:700px;overflow:hidden;display:flex;flex-direction:column;background:var(--rz-white);font-size:16px;line-height:1.5}
.pad{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding:24px 22px}
.pad>*{flex:none}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:32px}
.big{font-size:22px;font-weight:700;line-height:1.3;margin:0}
.soft-t{font-size:16px;margin:0}

/* RYZE look */
.rz{display:flex;flex-direction:column;height:100%;color:var(--rz-ink);background:var(--rz-white)}
.rz.dark{background:var(--rz-black);color:var(--rz-white)}
.rz .soft-t{color:var(--rz-mute)}
.logo{display:block}
.rtop{display:flex;align-items:center;gap:12px;padding:26px 22px 6px}
.rtop b{flex:1;font-size:18px;font-weight:700}
.rtop h2{flex:1;margin:0;font-size:26px;font-weight:700}
.ring{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#C77BFF,var(--rz-deep));display:grid;place-items:center;border:2px solid var(--rz)}
.join{background:var(--rz);color:#fff;border-radius:99px;padding:10px 18px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo>div{border-radius:22px;padding:18px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.d1{background:linear-gradient(160deg,var(--rz-deep),var(--rz-night))}
.d2{background:linear-gradient(180deg,#0B0B0C 40%,var(--rz-deep));border:1px solid #3A3A40}
.duo b{font-size:21px;line-height:1.2;font-weight:800}
.duo em{font-style:normal;color:#E15BD8}
.glass{background:rgba(255,255,255,.22);border-radius:12px;padding:10px;font-size:14px;font-weight:700;text-align:center}
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--rz-black);padding:12px 0 16px;font-size:13px;font-weight:600;color:#fff;text-align:center;border-top:1px solid #1F1F24}
.nav button,.nav div{background:none;border:0;padding:0;color:inherit;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px}
.nav [aria-current="page"]{color:#B45BFF}
.nav svg{width:24px;height:24px}
.nav .go svg{background:var(--rz);border-radius:50%;padding:4px;width:32px;height:32px;margin-top:-8px}
.sec{font-size:20px;font-weight:700;margin:0}
.tile{width:56px;height:56px;border-radius:14px;background:#fff;border:1px solid #E6E6EC;display:grid;place-items:center;flex:none}
.tile img{width:40px;height:auto;display:block}
.cb{border:0;width:100%;text-align:left;border-radius:20px;padding:18px;background:var(--rz-card);color:#fff;display:flex;gap:16px;align-items:center}
.cb div{flex:1;min-width:0}
.cb b{display:block;font-size:18px;font-weight:700}
.cb span{font-size:15px;color:#B9B9C3}
.lt{display:flex;align-items:center;gap:14px;padding:26px 22px 14px}
.lt h2{margin:0;font-size:21px;font-weight:700}
.bk{width:42px;height:42px;border-radius:50%;background:var(--rz-field);border:0;display:grid;place-items:center;font-size:20px;color:var(--rz-ink);flex:none}
.hero{height:220px;flex:none;background:linear-gradient(150deg,#B23BFF 0%,var(--rz) 35%,var(--rz-deep) 70%,var(--rz-night) 100%);color:#fff;display:flex;flex-direction:column}
.hero .lt h2{color:#fff}.hero .bk{background:rgba(255,255,255,.25);color:#fff}
.hero .mark{flex:1;display:grid;place-items:center;padding-bottom:30px}
.sheet{margin-top:-26px;border-radius:28px 28px 0 0;background:#fff;flex:1;padding:30px 24px;display:flex;flex-direction:column;gap:20px}
.sheet .hd{display:flex;gap:14px;align-items:center;font-size:22px;font-weight:700}
.buy{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px 22px;border-top:6px solid var(--rz-field);background:#fff}
.buy small{display:block;color:var(--rz-mute);font-size:15px}
.buy b{font-size:24px;font-weight:800}
.pill{border:0;border-radius:99px;padding:16px 26px;font-weight:700;font-size:16px;background:var(--rz-black);color:#fff}
.pill.wide{width:100%}
.tick{width:84px;height:84px;border-radius:50%;background:var(--rz-soft);display:grid;place-items:center}
.tick::before{content:"";width:30px;height:15px;border-left:5px solid var(--rz);border-bottom:5px solid var(--rz);transform:rotate(-45deg) translate(2px,-4px)}

/* RYZE screens rebuilt from the app screenshots (1 css px = 2 screenshot px) */
.shot{display:block;width:100%;height:auto}
.screen *{scrollbar-width:none}
.screen *::-webkit-scrollbar{display:none}
.hscroll{flex:1;overflow-y:auto;background:#000}
.svc4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 6px;padding:0 14px 26px}
.svc4 img{display:block;width:100%;height:auto;aspect-ratio:143/185}
.svc-sk{aspect-ratio:143/185;position:relative;background:#000;border:0;padding:0;color:#fff;width:100%}
.svc-sk .t{position:absolute;left:5.6%;top:3.8%;width:88.8%;aspect-ratio:1;background:#fff;border-radius:18%;display:grid;place-items:center}
.svc-sk .t img{width:64%;height:auto;aspect-ratio:61/40}
.svc-sk .t svg{width:58%;height:auto;color:var(--rz)}
.svc-sk b{position:absolute;left:0;right:0;top:83%;text-align:center;font-size:11.5px;line-height:1;font-weight:700}
.svc-sk::after{content:"Tap";position:absolute;right:2px;top:-6px;background:var(--rz);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.sub-top{display:flex;align-items:center;gap:12px;padding:22px 17px 14px}
.sub-top h2{margin:0;font-size:17px;font-weight:700}
.sub-top .bk{width:38px;height:38px;font-size:17px}
.sub-body{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.sub-body>*{flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--rz-field);border-radius:99px;padding:7px;margin:0 17px;font-size:12px;font-weight:700}
.seg button{border:0;background:none;border-radius:99px;padding:14px 4px}
.seg button[aria-pressed="true"]{background:var(--rz-black);color:#fff}
.find{background:var(--rz-field);border-radius:99px;margin:20px 17px 0;padding:15px 22px;color:#8A8A94;font-size:13px;display:flex;gap:16px;align-items:center}
.allchip{align-self:flex-start;margin:14px 17px 12px;background:#8B11EE;color:#fff;border-radius:99px;padding:9px 34px;font-size:10px;font-weight:700}
.srow{display:grid;grid-template-columns:49px minmax(0,1fr) 84px;gap:8px;align-items:start;width:100%;text-align:left;background:none;border:0;padding:0 17px;height:63px}
.srow .lg{width:49px;height:49px;border-radius:9px;background:#fff;border:1px solid #E6E6EC;display:grid;place-items:center}
.srow .lg img{width:34px;height:auto;aspect-ratio:61/40}
.srow .nm{padding-top:10px}
.srow .nm b{display:block;font-size:12.5px;line-height:1.2;font-weight:700;color:#2A2A2E}
.srow .nm small{display:block;font-size:9.8px;color:var(--rz-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .rt{text-align:center;padding-top:1px}
.srow .get{display:block;background:#000;color:#fff;border-radius:99px;padding:9px 0;font-size:10px;font-weight:700;line-height:13px}
.srow .rt small{display:block;margin-top:3px;font-size:9.5px;font-weight:600;color:#111;white-space:nowrap}
.subbar{display:flex;justify-content:space-between;align-items:center;padding:14px 17px 18px;background:#fff;border-top:1px solid #EFEFF3}
.subbar small{display:block;font-size:12px;color:var(--rz-mute)}
.subbar b{font-size:20px;font-weight:800}
.subbar span{background:linear-gradient(90deg,#8B11EE,#B23BFF);color:#fff;border-radius:99px;padding:16px 34px;font-size:12.5px;font-weight:700}
.lhead{display:flex;align-items:center;gap:10px;margin:22px 17px 10px;font-size:15px;font-weight:700}
.lhead .lg{width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid #E6E6EC;display:grid;place-items:center}
.lhead .lg img{width:21px;height:auto;aspect-ratio:61/40}
.lhead small{font-size:11px;font-weight:500;color:var(--rz-mute);display:block}
.srow .lg.pic{border:0;overflow:hidden;padding:0}
.srow .lg.pic img{width:100%;height:100%;object-fit:cover;aspect-ratio:auto}
.pshot{display:block;width:100%;height:auto}
.pscroll{flex:1;overflow-y:auto;background:#0E1A66}
.empty{flex:1;display:grid;place-items:center;padding:40px 24px;text-align:center;color:var(--rz-mute);font-size:14px}
.dh{aspect-ratio:360/192;height:auto;flex:none;position:relative;background-size:100% auto;background-position:top center;background-repeat:no-repeat;color:#fff}
.dh::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 40%)}
.dh .sub-top{position:relative}
.dh h2{color:#fff}
.dh .bk{background:rgba(120,120,120,.55);color:#fff}
.dsheet{margin-top:-14px;border-radius:20px 20px 0 0;background:#fff;position:relative;flex:1;padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.dsheet>*{flex:none}
.dsheet .hd{display:flex;gap:8px;align-items:center;font-size:16.5px;font-weight:700}
.dsheet .hd .lg{width:36px;height:36px;border-radius:9px;background:#fff;border:1px solid #E6E6EC;display:grid;place-items:center}
.dsheet .hd .lg img{width:26px;height:auto;aspect-ratio:61/40}
.dsheet p{margin:0;font-size:13px;color:#2A2A2E}
.dsheet .acc{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;margin-top:6px}
.dplay{position:absolute;left:50%;top:54%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center}
.dplay::before{content:"";margin-left:4px;border-left:16px solid #111;border-top:10px solid transparent;border-bottom:10px solid transparent}
.dfree{position:absolute;left:14px;bottom:26px;background:#fff;color:#111;font-size:10.5px;font-weight:700;border-radius:99px;padding:4px 10px}
.dpacks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dpacks button{border:1.5px solid #E6E6EC;background:#fff;border-radius:14px;padding:12px;text-align:left}
.dpacks button[aria-pressed="true"]{border-color:var(--rz);background:var(--rz-soft)}
.dpacks b{display:block;font-size:14px;font-weight:700}
.dpacks small{font-size:12px;color:var(--rz-mute)}
.dactive{background:var(--rz-soft);border-radius:14px;padding:14px;font-size:13px}
.dactive b{display:block;font-size:14.5px}
.wv{display:flex;align-items:center;gap:14px;background:#F1F1F5;color:#111;padding:20px 16px 10px;font-family:var(--font);font-size:14px;font-weight:700}
.wv span{font-size:16px;font-weight:400}
.wv small{margin-left:auto;font-size:11px;font-weight:500;color:#6E6E78}
.dbar{display:flex;justify-content:space-between;align-items:center;padding:12px 17px 16px;background:#fff;border-top:3px solid #F6F6F8}
.dbar small{display:block;font-size:12px;color:var(--rz-mute)}
.dbar b{font-size:20px;font-weight:800}
.dbar button{border:0;background:#000;color:#fff;border-radius:99px;width:141px;padding:17px 0;font-size:11.5px;font-weight:700}

/* RYZE brand, taken from ryze.live */
.rz.night{background:#000;color:#fff}
.night .sub-top h2{color:#fff}
.night .bk{background:#18191A;color:#fff;border:1px solid #303233}
.night .lhead{color:#fff}
.night .lhead small{color:#D0D2D3}
.n-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 17px 26px}
.n-card{background:#18191A;border:1px solid #303233;border-radius:12px;padding:10px 10px 14px;text-align:center;color:#fff;display:flex;flex-direction:column;gap:5px}
.n-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;margin-bottom:5px}
.n-card b{font-size:13.5px;font-weight:700;line-height:1.3}
.n-card small{font-size:11px;color:#D0D2D3}
.n-pill{align-self:center;margin-top:6px;background:linear-gradient(180deg,#9413F1,#560B8B);box-shadow:inset 0 3px 3px rgba(214,200,221,.25),inset 3px 0 3px rgba(214,200,221,.25);color:#fff;border-radius:99px;padding:7px 24px;font-size:11.5px;font-weight:600}
.night .dh .bk{background:rgba(24,25,26,.75);border:1px solid #303233}
.night .dsheet{background:#000;border-top:1px solid #303233}
.night .dsheet .hd,.night .dsheet .acc{color:#fff}
.night .dsheet p{color:#D0D2D3}
.night .dpacks button{background:#18191A;border:1px solid #303233;border-radius:12px;color:#fff}
.night .dpacks button[aria-pressed="true"]{border-color:#9413F1;background:rgba(148,19,241,.24)}
.night .dpacks small{color:#D0D2D3}
.night .dactive{background:rgba(148,19,241,.24);border:1px solid #9413F1;border-radius:12px;color:#fff}
.night .dbar{background:#000;border-top:1px solid #303233}
.night .dbar small{color:#D0D2D3}
.night .dbar b{color:#fff}
.night .dbar button,.night .pill{background:linear-gradient(180deg,#9413F1,#560B8B);box-shadow:inset 0 4px 4px rgba(214,200,221,.25),inset 4px 0 4px rgba(214,200,221,.25);color:#fff}
.night .big{color:#fff}
.night .soft-t{color:#D0D2D3}
.night .tick{background:linear-gradient(180deg,#9413F1,#560B8B);box-shadow:0 0 44px rgba(148,19,241,.65)}
.night .tick::before{border-color:#fff}

/* Shikho portal (loads in a WebView after payment) */
.sp .wv+.sp-top{padding-top:12px}
.sp{display:flex;flex-direction:column;height:100%;background:var(--sk-bg);color:var(--sk-text);font-family:var(--bn)}
.sp-top{background:#fff;display:flex;align-items:center;gap:12px;padding:28px 18px 14px;font-size:18px;font-weight:500}
.sp-top button{background:none;border:0;font-size:22px;line-height:1;padding:0 4px}
.sp-scroll{flex:1;overflow-y:auto}
.sp-video{display:block;width:100%;height:auto;aspect-ratio:360/192}
.sp-vwrap{position:relative}
.sp-vwrap::after{content:"";position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(60,60,60,.72)}
.sp-vwrap::before{content:"";position:absolute;left:50%;top:50%;z-index:1;margin:-10px 0 0 -6px;border-left:17px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
.sp-info{background:#fff;border-radius:0 0 18px 18px;padding:20px 18px 24px}
.sp-info h3{margin:0 0 10px;font-size:20px;line-height:1.4;font-weight:700}
.sp-info p{margin:0;font-size:15px;line-height:1.65;color:var(--sk-mute)}
.sp-packs{padding:24px 18px 28px;display:flex;flex-direction:column;gap:14px}
.sp-packs>p{margin:0 0 2px;font-size:16px;color:var(--sk-text)}
.sp-pack{background:#fff;border:0;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:8px;display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.sp-pack img{width:128px;height:auto;border-radius:10px;flex:none;display:block}
.sp-pack b{display:block;font-size:17px;font-weight:600}
.sp-pack span{display:block;font-size:14px;color:var(--sk-mute);margin-top:2px}
.sp-pack em{display:block;font-style:normal;font-size:16px;font-weight:600;color:var(--sk-pink);margin-top:6px}
.sp-card{margin:24px 18px 28px;background:var(--sk-card);border:1px solid var(--sk-card-line);border-radius:18px;padding:28px 20px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-card img{width:66px;height:auto;aspect-ratio:61/40}
.sp-card h3{margin:6px 0 0;font-size:19px;line-height:1.5;font-weight:400}
.sp-card h3 b{font-weight:700}
.sp-card p{margin:0;font-size:14.5px;line-height:1.65;color:var(--sk-mute)}
.sp-card button{margin-top:8px;width:100%;border:0;border-radius:8px;background:var(--sk-blue);color:#fff;font-size:17px;font-weight:500;padding:13px}

/* Shikho Student Portal (phone browser) */
.sk{display:flex;flex-direction:column;height:100%;background:var(--ground);color:var(--ink)}
.sk .soft-t{color:var(--ink-2)}
.url{background:var(--sunken);padding:22px 16px 12px}
.url span{display:block;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:15px;color:var(--ink-2);text-align:center}
.bar{background:var(--navy);color:#fff;padding:16px 22px;font-size:20px;font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;font-size:18px;font-weight:700}
.cta{background:var(--sk-blue);color:#fff;border:0;border-radius:12px;padding:16px;font-weight:700;font-size:17px;width:100%}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--navy);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.field{display:grid;gap:8px;font-size:16px;font-weight:600}
.field span{background:var(--paper);border:1px solid var(--line);border-radius:12px;height:52px;display:block}
.prog{display:flex;gap:8px}
.prog i{height:6px;flex:1;border-radius:99px;background:var(--line)}
.prog i.on{background:var(--sk-blue)}
@media (max-width:880px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:24px 48px;justify-items:center}
  .side{gap:18px;width:100%;max-width:520px}
  h1{font-size:30px}
  .cap{padding:24px;gap:14px}
  .cap h2{font-size:24px}
  .cap p{font-size:18px}
}
</style>

var C=[["SSC'29 Math", "Class 8", "C8", "ক্লাস ৮ - SSC '29 - গণিত", "প্যাটার্ন এর প্রাথমিক ধারণা", "এই ভিডিওতে আমরা সহজ ভাষায় প্যাটার্ন বিষয়টি বুঝে নেব। শুরুতে প্যাটার্নের সংজ্ঞা কী, তা পরিষ্কারভাবে ব্যাখ্যা করা হবে। এরপর দৈনন্দিন জীবন ও গণিত থেকে কিছু সহজ উদাহরণের মাধ্যমে প্যাটার্ন চেনার কৌশল দেখানো হবে। শেষে প্যাটার্নের বিভিন্ন প্রকারভেদ নিয়ে সংক্ষিপ্ত আলোচনা করা হবে, যাতে বিষয়টি আরও পরিষ্কারভাবে বোঝা যায়।"], ["SSC'28 Math", "Class 9", "C9", "ক্লাস ৯ - SSC '28 গণিত", "সংখ্যার শ্রেণিবিন্যাস", "এই ভিডিওতে আমরা সংখ্যার বিভিন্ন প্রকার ও তাদের ধারণা সহজভাবে আলোচনা করবো। শুরুতে স্বাভাবিক সংখ্যা, মৌলিক সংখ্যা ও অমৌলিক সংখ্যার ধারণা স্পষ্টভাবে ব্যাখ্যা করা হবে। এরপর ভগ্নাংশ, মূলদ সংখ্যা ও অমূলদ সংখ্যা সম্পর্কে পরিষ্কার ধারণা দেওয়া হবে, সাথে সহজ উদাহরণও দেখানো হবে। ভিডিওর শেষ অংশে সংখ্যার শ্রেণিবিন্যাস কীভাবে করা হয়, তা ধাপে ধাপে বুঝিয়ে বলা হবে, যাতে শিক্ষার্থীরা পুরো বিষয়টি সহজে বুঝতে পারে।"], ["SSC'27 Math", "Class 10", "C10", "ক্লাস ১০ - SSC '27 গণিত", "দুই চলক বিশিষ্ট সমীকরণ ও সমাধানের যোগ্যতা", "এই ভিডিওতে আমরা দুই চলক বিশিষ্ট সমীকরণ বিষয়টি সহজভাবে আলোচনা করবো। শুরুতে দুই চলক বিশিষ্ট সমীকরণের ধারণা পরিষ্কারভাবে ব্যাখ্যা করা হবে। এরপর কোন সমীকরণ সমাধানের যোগ্য কি না, সে বিষয়ে প্রয়োজনীয় ধারণা দেওয়া হবে। সবশেষে বোর্ড পরীক্ষায় আসতে পারে এমন কিছু গুরুত্বপূর্ণ সমস্যা ধাপে ধাপে সমাধান করে দেখানো হবে, যা শিক্ষার্থীদের পরীক্ষার প্রস্তুতিতে সহায়ক হবে।"]];

var $=function(id){return document.getElementById(id)},screen=$('screen');

function steps(){return FLOWS[F].steps}
function sync(){var st=steps(),j;for(j=I;j<st.length;j++){if(st[j][5]()){I=j;return}}for(j=0;j<I;j++){if(st[j][5]()){I=j;return}}}
function caption(){var st=steps(),s=st[I];$('count').textContent='Step '+(I+1)+' of '+st.length;$('who').textContent=s[1];$('who').className='who '+s[0];$('ttl').textContent=s[2];$('dsc').textContent=s[3];
 $('prev').disabled=I===0;$('next').textContent=I===st.length-1?'Restart':'Next';
 $('dots').innerHTML=st.map(function(x,i){return '<button type="button" data-step="'+i+'" aria-label="Step '+(i+1)+': '+x[2]+'"'+(i<=I?' class="on"':'')+'></button>'}).join('');
 [].forEach.call($('flows').children,function(b,i){b.setAttribute('aria-selected',i===F)})}
function paint(){screen.innerHTML=V[S.scr]();sync();caption();var sc=screen.querySelector('.sp-scroll');if(sc&&S.bought&&S.scr==='video'){sc.scrollTop=sc.scrollHeight;requestAnimationFrame(function(){sc.scrollTop=sc.scrollHeight})}}
function go(s){S.scr=s;paint()}
function jump(i){I=i;steps()[i][4]();paint()}
screen.addEventListener('click',function(e){var t=e.target.closest('[data-go],[data-pack],[data-buy],[data-tab],[data-lc],[data-sel]');if(!t)return;
 if(t.dataset.lc){var k=+t.dataset.lc;if(S.bought&&k!==S.course){S.bought=false;S.days=0}S.course=k;S.more=false;S.from='learn';go('course');return}
 if(t.dataset.sel){S.pack=+t.dataset.sel;paint();return}
 if(t.dataset.tab){S.tab=t.dataset.tab;paint();return}
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.pack){if(t.dataset.c!=null){if(S.bought&&+t.dataset.c!==S.course){S.bought=false;S.days=0}S.course=+t.dataset.c}S.pack=+t.dataset.pack;S.from=S.scr;S.more=S.bought;go('course');return}
 if(t.dataset.buy){S.days=(S.bought?S.days:0)+S.pack;S.bought=true;S.more=false;go('success');return}
});
$('next').addEventListener('click',function(){jump(I===steps().length-1?0:I+1)});

})();
